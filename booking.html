<!DOCTYPE html>
<html>
<head>
    <title>Transport Booking</title>

    <style>
        body{
            font-family: Arial;
            background:#eeeeee;
        }

        .box{
            width:400px;
            margin:50px auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }

        h2{
            text-align:center;
            color:blue;
        }

        input, select{
            width:100%;
            padding:10px;
            margin:8px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:blue;
            color:white;
            border:0;
            cursor:pointer;
        }

    </style>

</head>


<body>


<div class="box">

<h2>Transport Booking Form</h2>


<form>

<label>Name</label>
<input type="text" placeholder="Enter name">


<label>Phone</label>
<input type="text" placeholder="Enter phone">


<label>From</label>

<select>
<option>Choose location</option>
<option>Dodoma</option>
<option>Dar es Salaam</option>
</select>



<label>Destination</label>

<select>
<option>Choose destination</option>
<option>Arusha</option>
<option>Mwanza</option>
</select>



<label>Date</label>
<input type="date">



<button type="submit">
Book Now
</button>


</form>


</div>


</body>
</html>
